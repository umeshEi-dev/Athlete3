<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Athlete Web3 - Holder Era & Backpack MVP</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#f0f6ff',
                            100: '#e0edff',
                            500: '#3b82f6',
                            600: '#2563eb',
                            700: '#1d4ed8',
                            900: '#0f172a'
                        }
                    }
                }
            }
        }
    </script>
    <!-- React & Babel CDNs -->
    <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #0b0f19;
            color: #f3f4f6;
        }
        .glass-card {
            background: rgba(17, 24, 39, 0.75);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
        .glass-card-active {
            background: rgba(16, 185, 129, 0.08);
            border: 1px solid rgba(16, 185, 129, 0.3);
        }
        .glass-card-closed {
            background: rgba(107, 114, 128, 0.08);
            border: 1px solid rgba(107, 114, 128, 0.2);
        }
        .pulse-badge {
            box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.7);
            animation: pulse-green 2s infinite;
        }
        @keyframes pulse-green {
            0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.7); }
            70% { transform: scale(1); box-shadow: 0 0 0 8px rgba(16, 185, 129, 0); }
            100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(16, 185, 129, 0); }
        }
    </style>
</head>
<body class="min-h-screen text-slate-100 flex flex-col justify-between selection:bg-blue-500 selection:text-white">

    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        // Default initial demo state
        const INITIAL_DEMO_DATA = {
            id: "101",
            name: "Rahul Sharma",
            sport: "Track & Field (100m Sprint)",
            image: "https://images.unsplash.com/photo-1530549387789-4c1017266635?auto=format&fit=crop&q=80&w=800",
            currentOwner: "Rahul",
            ownerWallet: "0xRahul...88A9",
            currentEraLetter: "A",
            activeEraId: "era-a",
            
            // Permanent Athlete Backpack (Stays with Athlete #101 across transfers)
            backpack: [
                {
                    id: "asset-1",
                    title: "National Championship Trophy",
                    category: "Trophy",
                    icon: "fa-trophy",
                    color: "from-amber-400 to-yellow-600",
                    description: "1st Place 100m Dash Gold Medal & Trophy (2025)",
                    dateAdded: "Nov 2025"
                },
                {
                    id: "asset-2",
                    title: "Genesis Rookie NFT Card",
                    category: "Card",
                    icon: "fa-id-card",
                    color: "from-purple-500 to-indigo-600",
                    description: "Limited 1-of-1 Minted Athlete Identity Card",
                    dateAdded: "Jan 2026"
                },
                {
                    id: "asset-3",
                    title: "Sub-10s Record Badge",
                    category: "Achievement",
                    icon: "fa-award",
                    color: "from-emerald-400 to-teal-600",
                    description: "Official Athletic Union Verified Sub-10 Seconds Sprint",
                    dateAdded: "Feb 2026"
                },
                {
                    id: "asset-4",
                    title: "Pro Signature Spikes",
                    category: "Equipment",
                    icon: "fa-shoe-prints",
                    color: "from-rose-500 to-orange-500",
                    description: "Verified Race-Worn Signed Carbon Fiber Cleats",
                    dateAdded: "Mar 2026"
                }
            ],

            // Holder Eras Log
            eras: [
                {
                    id: "era-a",
                    eraName: "Holder Era A",
                    ownerName: "Rahul",
                    ownerWallet: "0xRahul...88A9",
                    status: "Active",
                    mode: "Collector",
                    sportsFundBalance: 100,
                    nilBalance: 50,
                    startDate: "Jan 2026",
                    endDate: "Present"
                }
            ]
        };

        function App() {
            const [athlete, setAthlete] = useState(INITIAL_DEMO_DATA);
            const [activeTab, setActiveTab] = useState('detail'); // 'dashboard', 'detail'
            const [isTransferModalOpen, setIsTransferModalOpen] = useState(false);
            const [newOwnerName, setNewOwnerName] = useState('Aman');
            const [newOwnerWallet, setNewOwnerWallet] = useState('0xAman...77B2');
            const [selectedMode, setSelectedMode] = useState('NIL');
            const [showSuccessToast, setShowSuccessToast] = useState(false);
            const [toastMessage, setToastMessage] = useState('');

            // Get current active era object
            const activeEra = athlete.eras.find(e => e.status === 'Active') || athlete.eras[athlete.eras.length - 1];

            const handleTransfer = (e) => {
                e.preventDefault();
                if (!newOwnerName.trim()) return;

                const nextEraLetter = String.fromCharCode(athlete.currentEraLetter.charCodeAt(0) + 1);
                const nextEraId = `era-${nextEraLetter.toLowerCase()}`;
                const currentDateStr = "Aug 2026";

                // Close current Era A
                const updatedEras = athlete.eras.map(era => {
                    if (era.status === 'Active') {
                        return {
                            ...era,
                            status: 'Closed',
                            endDate: currentDateStr
                        };
                    }
                    return era;
                });

                // Create new Era B with $0 / $0 fresh balances
                const newEraObj = {
                    id: nextEraId,
                    eraName: `Holder Era ${nextEraLetter}`,
                    ownerName: newOwnerName,
                    ownerWallet: newOwnerWallet || `0x${newOwnerName.toUpperCase()}...99X`,
                    status: 'Active',
                    mode: selectedMode,
                    sportsFundBalance: 0, // RESET to 0
                    nilBalance: 0,         // RESET to 0
                    startDate: currentDateStr,
                    endDate: 'Present'
                };

                updatedEras.push(newEraObj);

                setAthlete({
                    ...athlete,
                    currentOwner: newOwnerName,
                    ownerWallet: newEraObj.ownerWallet,
                    currentEraLetter: nextEraLetter,
                    activeEraId: nextEraId,
                    eras: updatedEras
                });

                setIsTransferModalOpen(false);
                setToastMessage(`Transferred to ${newOwnerName}! Era ${nextEraLetter} created with $0 balances. Backpack preserved.`);
                setShowSuccessToast(true);

                setTimeout(() => {
                    setShowSuccessToast(false);
                }, 5000);
            };

            const resetDemo = () => {
                setAthlete(INITIAL_DEMO_DATA);
                setNewOwnerName('Aman');
                setNewOwnerWallet('0xAman...77B2');
                setSelectedMode('NIL');
                setToastMessage('Demo state reset to initial state (Holder Era A - Rahul).');
                setShowSuccessToast(true);
                setTimeout(() => setShowSuccessToast(false), 3000);
            };

            return (
                <div className="min-h-screen flex flex-col justify-between">
                    {}
                    <header className="border-b border-slate-800 bg-slate-950/80 backdrop-blur sticky top-0 z-40">
                        <div className="max-w-6xl mx-auto px-4 py-3 flex items-center justify-between">
                            <div className="flex items-center space-x-3 cursor-pointer" onClick={() => setActiveTab('detail')}>
                                <div className="w-10 h-10 rounded-xl bg-gradient-to-tr from-blue-600 to-indigo-500 flex items-center justify-center text-white font-black text-xl shadow-lg shadow-blue-500/20">
                                    <i className="fa-solid fa-bolt"></i>
                                </div>
                                <div>
                                    <span className="font-extrabold text-lg text-white tracking-tight">ATHLETE <span className="text-blue-500">Web3</span></span>
                                    <span className="block text-[10px] uppercase font-semibold text-slate-400 tracking-wider">Holder Era & Backpack Prototype</span>
                                </div>
                            </div>

                            {/* Nav Options */}
                            <div className="flex items-center space-x-2 sm:space-x-4">
                                <button 
                                    onClick={() => setActiveTab('dashboard')} 
                                    className={`px-3 py-1.5 rounded-lg text-xs sm:text-sm font-semibold transition ${activeTab === 'dashboard' ? 'bg-blue-600 text-white' : 'text-slate-400 hover:text-slate-200 hover:bg-slate-800'}`}>
                                    <i className="fa-solid fa-grid-2 mr-1.5"></i> Dashboard
                                </button>
                                <button 
                                    onClick={() => setActiveTab('detail')} 
                                    className={`px-3 py-1.5 rounded-lg text-xs sm:text-sm font-semibold transition ${activeTab === 'detail' ? 'bg-blue-600 text-white' : 'text-slate-400 hover:text-slate-200 hover:bg-slate-800'}`}>
                                    <i className="fa-solid fa-user-ninja mr-1.5"></i> Athlete #{athlete.id}
                                </button>
                                <button 
                                    onClick={resetDemo} 
                                    title="Reset demo data to default (Rahul - Era A)"
                                    className="px-2.5 py-1.5 rounded-lg text-xs font-medium text-slate-400 hover:text-amber-400 hover:bg-amber-500/10 border border-slate-800 transition">
                                    <i className="fa-solid fa-rotate-right mr-1"></i> Reset Demo
                                </button>
                            </div>
                        </div>
                    </header>

                    {}
                    {showSuccessToast && (
                        <div className="fixed top-16 right-4 z-50 max-w-md bg-emerald-950 border border-emerald-500/50 text-emerald-200 px-4 py-3 rounded-xl shadow-2xl flex items-center space-x-3 animate-bounce">
                            <i className="fa-solid fa-circle-check text-emerald-400 text-xl"></i>
                            <div className="text-xs sm:text-sm font-medium">{toastMessage}</div>
                        </div>
                    )}

                    {/* MAIN CONTENT AREA */}
                    <main className="max-w-6xl mx-auto px-4 py-6 flex-1 w-full">

                        {/* VIEW 1: DASHBOARD */}
                        {activeTab === 'dashboard' && (
                            <div className="space-y-6">
                                <div className="flex flex-col md:flex-row md:items-center justify-between gap-4 bg-gradient-to-r from-blue-900/30 to-indigo-900/20 p-6 rounded-2xl border border-blue-500/20">
                                    <div>
                                        <h1 className="text-2xl font-bold text-white">Athlete NFT Roster</h1>
                                        <p className="text-slate-400 text-sm mt-1">
                                            Select an athlete below to inspect their permanent Backpack assets and test the Holder Era transfer logic.
                                        </p>
                                    </div>
                                    <button 
                                        onClick={() => setActiveTab('detail')}
                                        className="self-start md:self-auto bg-blue-600 hover:bg-blue-500 text-white px-4 py-2 rounded-xl text-sm font-semibold transition flex items-center gap-2 shadow-lg shadow-blue-600/30">
                                        Inspect Active Athlete <i className="fa-solid fa-arrow-right"></i>
                                    </button>
                                </div>

                                <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                                    {/* Primary Demo Card: Athlete #101 */}
                                    <div 
                                        onClick={() => setActiveTab('detail')}
                                        className="glass-card rounded-2xl p-5 hover:border-blue-500/50 transition cursor-pointer group relative overflow-hidden flex flex-col justify-between">
                                        <div className="absolute top-3 right-3 bg-blue-600/80 text-white text-[11px] font-bold px-2.5 py-1 rounded-full border border-blue-400/30">
                                            Active Demo
                                        </div>

                                        <div>
                                            <div className="relative h-48 rounded-xl overflow-hidden mb-4 bg-slate-800">
                                                <img src={athlete.image} alt={athlete.name} className="w-full h-full object-cover group-hover:scale-105 transition duration-500" />
                                                <div className="absolute bottom-2 left-2 bg-slate-950/80 backdrop-blur px-2.5 py-1 rounded-lg text-xs font-semibold text-slate-200">
                                                    Token #{athlete.id}
                                                </div>
                                            </div>

                                            <h3 className="text-xl font-bold text-white group-hover:text-blue-400 transition">{athlete.name}</h3>
                                            <p className="text-xs text-slate-400 mb-4">{athlete.sport}</p>

                                            <div className="grid grid-cols-2 gap-2 text-xs mb-4">
                                                <div className="bg-slate-900/60 p-2.5 rounded-lg border border-slate-800">
                                                    <span className="text-slate-400 block text-[10px] uppercase font-semibold">Current Owner</span>
                                                    <span className="font-bold text-slate-200">{athlete.currentOwner}</span>
                                                </div>
                                                <div className="bg-slate-900/60 p-2.5 rounded-lg border border-slate-800">
                                                    <span className="text-slate-400 block text-[10px] uppercase font-semibold">Holder Era</span>
                                                    <span className="font-bold text-emerald-400">Era {athlete.currentEraLetter}</span>
                                                </div>
                                            </div>
                                        </div>

                                        <div className="pt-3 border-t border-slate-800 flex items-center justify-between text-xs text-slate-400">
                                            <span>Mode: <strong className="text-slate-200">{activeEra?.mode}</strong></span>
                                            <span className="text-blue-400 font-semibold group-hover:translate-x-1 transition flex items-center gap-1">
                                                View Era Details <i className="fa-solid fa-angle-right"></i>
                                            </span>
                                        </div>
                                    </div>

                                    {/* Secondary Static Demo Card 1 */}
                                    <div className="glass-card rounded-2xl p-5 opacity-60 relative overflow-hidden flex flex-col justify-between">
                                        <div>
                                            <div className="relative h-48 rounded-xl overflow-hidden mb-4 bg-slate-800">
                                                <img src="https://images.unsplash.com/photo-1546519638-68e109498ffc?auto=format&fit=crop&q=80&w=800" alt="Sarah Jenkins" className="w-full h-full object-cover" />
                                                <div className="absolute bottom-2 left-2 bg-slate-950/80 backdrop-blur px-2.5 py-1 rounded-lg text-xs font-semibold text-slate-200">
                                                    Token #102
                                                </div>
                                            </div>
                                            <h3 className="text-xl font-bold text-white">Sarah Jenkins</h3>
                                            <p className="text-xs text-slate-400 mb-4">Women's Basketball</p>
                                            <div className="grid grid-cols-2 gap-2 text-xs mb-4">
                                                <div className="bg-slate-900/60 p-2.5 rounded-lg border border-slate-800">
                                                    <span className="text-slate-400 block text-[10px] uppercase">Current Owner</span>
                                                    <span className="font-bold text-slate-200">DAO Vault</span>
                                                </div>
                                                <div className="bg-slate-900/60 p-2.5 rounded-lg border border-slate-800">
                                                    <span className="text-slate-400 block text-[10px] uppercase">Holder Era</span>
                                                    <span className="font-bold text-emerald-400">Era A</span>
                                                </div>
                                            </div>
                                        </div>
                                        <div className="pt-3 border-t border-slate-800 text-xs text-slate-500 italic">
                                            Secondary demo asset (Static)
                                        </div>
                                    </div>
                                </div>
                            </div>
                        )}

                        {/* VIEW 2: ATHLETE DETAIL & ERA LOGIC */}
                        {activeTab === 'detail' && (
                            <div className="space-y-8">
                                
                                {/* SECTION 1: ATHLETE HEADER CARD */}
                                <div className="glass-card rounded-2xl p-6 relative overflow-hidden">
                                    <div className="flex flex-col md:flex-row gap-6 items-start md:items-center justify-between">
                                        <div className="flex flex-col sm:flex-row items-start sm:items-center gap-5">
                                            <div className="relative w-24 h-24 sm:w-28 sm:h-28 rounded-2xl overflow-hidden border-2 border-blue-500/30 shadow-lg shrink-0">
                                                <img src={athlete.image} alt={athlete.name} className="w-full h-full object-cover" />
                                                <div className="absolute bottom-0 inset-x-0 bg-slate-950/90 text-[10px] text-center font-bold py-0.5 text-blue-400">
                                                    # {athlete.id}
                                                </div>
                                            </div>
                                            
                                            <div>
                                                <div className="flex flex-wrap items-center gap-2 mb-1">
                                                    <h1 className="text-2xl sm:text-3xl font-extrabold text-white">{athlete.name}</h1>
                                                    <span className="bg-blue-500/10 border border-blue-500/30 text-blue-400 text-xs font-semibold px-2.5 py-0.5 rounded-full">
                                                        {athlete.sport}
                                                    </span>
                                                </div>
                                                
                                                <p className="text-slate-400 text-xs sm:text-sm mb-3">
                                                    Token ID: <code className="text-blue-300 font-mono">0x742d...101</code>
                                                </p>

                                                <div className="flex flex-wrap items-center gap-4 text-xs">
                                                    <div className="flex items-center space-x-1.5 bg-slate-900/80 px-3 py-1.5 rounded-lg border border-slate-800">
                                                        <i className="fa-solid fa-user-check text-blue-400"></i>
                                                        <span className="text-slate-400">Current Owner:</span>
                                                        <span className="font-bold text-white">{athlete.currentOwner}</span>
                                                    </div>

                                                    <div className="flex items-center space-x-1.5 bg-emerald-950/50 border border-emerald-500/30 px-3 py-1.5 rounded-lg">
                                                        <span className="w-2 h-2 rounded-full bg-emerald-400 pulse-badge"></span>
                                                        <span className="text-emerald-300 font-semibold">Holder Era {athlete.currentEraLetter}</span>
                                                    </div>

                                                    <div className="flex items-center space-x-1.5 bg-slate-900/80 px-3 py-1.5 rounded-lg border border-slate-800">
                                                        <i className="fa-solid fa-sliders text-indigo-400"></i>
                                                        <span className="text-slate-400">Mode:</span>
                                                        <span className="font-bold text-indigo-300">{activeEra?.mode}</span>
                                                    </div>
                                                </div>
                                            </div>
                                        </div>

                                        <button 
                                            onClick={() => setIsTransferModalOpen(true)}
                                            className="w-full md:w-auto bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-500 hover:to-indigo-500 text-white font-bold px-6 py-3 rounded-xl shadow-lg shadow-blue-600/25 transition flex items-center justify-center gap-2 group">
                                            <i className="fa-solid fa-paper-plane group-hover:translate-x-0.5 group-hover:-translate-y-0.5 transition"></i>
                                            Transfer Athlete
                                        </button>
                                    </div>
                                </div>

                                {/* SECTION 2: ATHLETE BACKPACK (PERMANENT ASSETS) */}
                                {}
                                <div className="space-y-4">
                                    <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-2 border-b border-slate-800 pb-3">
                                        <div>
                                            <h2 className="text-xl font-bold text-white flex items-center gap-2">
                                                <i className="fa-solid fa-briefcase text-amber-400"></i> Athlete Backpack
                                            </h2>
                                            <p className="text-xs text-slate-400 mt-0.5">
                                                Permanent on-chain digital assets attached directly to Athlete #{athlete.id}.
                                            </p>
                                        </div>
                                        <div className="bg-amber-500/10 border border-amber-500/30 text-amber-300 text-xs font-semibold px-3 py-1.5 rounded-xl flex items-center gap-2">
                                            <i className="fa-solid fa-shield-halved"></i>
                                            <span><strong>Rule:</strong> Backpack assets REMAIN with athlete on transfer</span>
                                        </div>
                                    </div>

                                    <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
                                        {athlete.backpack.map((item) => (
                                            <div key={item.id} className="glass-card rounded-xl p-4 border border-slate-800/80 hover:border-slate-700 transition flex flex-col justify-between">
                                                <div>
                                                    <div className={`w-10 h-10 rounded-lg bg-gradient-to-tr ${item.color} flex items-center justify-center text-white text-lg shadow-md mb-3`}>
                                                        <i className={`fa-solid ${item.icon}`}></i>
                                                    </div>
                                                    <div className="text-[10px] uppercase tracking-wider font-extrabold text-slate-400 mb-1">
                                                        {item.category}
                                                    </div>
                                                    <h4 className="font-bold text-slate-100 text-sm mb-1">{item.title}</h4>
                                                    <p className="text-xs text-slate-400 leading-relaxed mb-3">{item.description}</p>
                                                </div>
                                                <div className="text-[11px] text-slate-500 border-t border-slate-800/60 pt-2 flex items-center justify-between">
                                                    <span>Added: {item.dateAdded}</span>
                                                    <span className="text-emerald-400 font-semibold">Attached</span>
                                                </div>
                                            </div>
                                        ))}
                                    </div>
                                </div>

                                {/* SECTION 3: CURRENT HOLDER ERA & BALANCES */}
                                {}
                                <div className="space-y-4">
                                    <div className="border-b border-slate-800 pb-3">
                                        <h2 className="text-xl font-bold text-white flex items-center gap-2">
                                            <i className="fa-solid fa-layer-group text-emerald-400"></i> Current Holder Era
                                        </h2>
                                        <p className="text-xs text-slate-400 mt-0.5">
                                            Owner-specific balances and benefits are tied strictly to the active Holder Era.
                                        </p>
                                    </div>

                                    <div className="glass-card glass-card-active rounded-2xl p-6 border relative overflow-hidden">
                                        <div className="flex flex-col lg:flex-row items-start lg:items-center justify-between gap-6">
                                            
                                            {/* Era Meta */}
                                            <div className="space-y-2">
                                                <div className="flex items-center space-x-3">
                                                    <span className="text-2xl font-black text-white">{activeEra?.eraName}</span>
                                                    <span className="bg-emerald-500/20 text-emerald-300 text-xs font-bold px-3 py-1 rounded-full border border-emerald-500/40 uppercase tracking-wide">
                                                        ● Active Era
                                                    </span>
                                                </div>
                                                <div className="text-sm text-slate-300 flex flex-wrap items-center gap-x-4 gap-y-1">
                                                    <span>Owner: <strong className="text-white">{activeEra?.ownerName}</strong> ({activeEra?.ownerWallet})</span>
                                                    <span className="text-slate-500">•</span>
                                                    <span>Mode: <strong className="text-indigo-300">{activeEra?.mode}</strong></span>
                                                    <span className="text-slate-500">•</span>
                                                    <span>Since: <strong className="text-slate-200">{activeEra?.startDate}</strong></span>
                                                </div>
                                            </div>

                                            {/* Financial Balances Card */}
                                            <div className="w-full lg:w-auto grid grid-cols-2 gap-4 bg-slate-950/80 p-4 rounded-xl border border-slate-800">
                                                <div className="pr-4 border-r border-slate-800">
                                                    <span className="text-[11px] uppercase font-bold text-slate-400 block mb-0.5">Sports Fund Balance</span>
                                                    <span className="text-2xl font-extrabold text-emerald-400">${activeEra?.sportsFundBalance}</span>
                                                    <span className="text-[10px] text-slate-500 block">Owner-specific yield</span>
                                                </div>
                                                <div className="pl-2">
                                                    <span className="text-[11px] uppercase font-bold text-slate-400 block mb-0.5">NIL Balance</span>
                                                    <span className="text-2xl font-extrabold text-blue-400">${activeEra?.nilBalance}</span>
                                                    <span className="text-[10px] text-slate-500 block">Sponsorship escrow</span>
                                                </div>
                                            </div>

                                        </div>

                                        {/* Transfer Trigger CTA inside Era card */}
                                        <div className="mt-6 pt-4 border-t border-slate-800/80 flex flex-col sm:flex-row items-center justify-between gap-4 text-xs text-slate-400">
                                            <p className="flex items-center gap-1.5">
                                                <i className="fa-solid fa-circle-info text-blue-400"></i>
                                                When transferred, <strong>{activeEra?.eraName}</strong> will CLOSE and balances will NOT carry over to the new owner.
                                            </p>
                                            <button 
                                                onClick={() => setIsTransferModalOpen(true)}
                                                className="w-full sm:w-auto bg-slate-800 hover:bg-slate-700 text-white font-semibold px-4 py-2 rounded-lg border border-slate-700 transition flex items-center justify-center gap-2">
                                                Transfer Athlete <i className="fa-solid fa-arrow-right text-xs"></i>
                                            </button>
                                        </div>
                                    </div>
                                </div>

                                {/* SECTION 4: HOLDER ERA HISTORY */}
                                {}
                                <div className="space-y-4">
                                    <div className="border-b border-slate-800 pb-3">
                                        <h2 className="text-xl font-bold text-white flex items-center gap-2">
                                            <i className="fa-solid fa-clock-rotate-left text-indigo-400"></i> Holder Era History
                                        </h2>
                                        <p className="text-xs text-slate-400 mt-0.5">
                                            Complete ledger of historical owners and settled Era balances.
                                        </p>
                                    </div>

                                    <div className="space-y-3">
                                        {athlete.eras.slice().reverse().map((era) => {
                                            const isActive = era.status === 'Active';
                                            return (
                                                <div 
                                                    key={era.id} 
                                                    className={`rounded-xl p-4 transition flex flex-col sm:flex-row sm:items-center justify-between gap-4 ${isActive ? 'glass-card glass-card-active' : 'glass-card glass-card-closed'}`}>
                                                    
                                                    <div className="flex items-start sm:items-center space-x-3">
                                                        <div className={`w-9 h-9 rounded-lg flex items-center justify-center text-sm font-bold shrink-0 ${isActive ? 'bg-emerald-500/20 text-emerald-400 border border-emerald-500/30' : 'bg-slate-800 text-slate-400 border border-slate-700'}`}>
                                                            {era.eraName.replace('Holder Era ', '')}
                                                        </div>
                                                        <div>
                                                            <div className="flex items-center space-x-2">
                                                                <span className="font-bold text-white text-sm">{era.eraName}</span>
                                                                <span className={`text-[10px] font-bold px-2 py-0.5 rounded ${isActive ? 'bg-emerald-500/20 text-emerald-400 border border-emerald-500/30' : 'bg-slate-800 text-slate-400 border border-slate-700'}`}>
                                                                    {era.status}
                                                                </span>
                                                            </div>
                                                            <div className="text-xs text-slate-400 mt-0.5">
                                                                Owner: <strong className="text-slate-200">{era.ownerName}</strong> ({era.ownerWallet}) • Mode: {era.mode}
                                                            </div>
                                                            <div className="text-[11px] text-slate-500 mt-0.5">
                                                                Duration: {era.startDate} — {era.endDate}
                                                            </div>
                                                        </div>
                                                    </div>

                                                    <div className="flex items-center space-x-4 text-right bg-slate-950/40 p-2.5 rounded-lg border border-slate-800/80 self-start sm:self-auto">
                                                        <div>
                                                            <div className="text-[10px] uppercase text-slate-400 font-semibold">Sports Fund</div>
                                                            <div className={`text-sm font-bold ${isActive ? 'text-emerald-400' : 'text-slate-400'}`}>
                                                                ${era.sportsFundBalance}
                                                            </div>
                                                        </div>
                                                        <div className="w-px h-6 bg-slate-800"></div>
                                                        <div>
                                                            <div className="text-[10px] uppercase text-slate-400 font-semibold">NIL Earnings</div>
                                                            <div className={`text-sm font-bold ${isActive ? 'text-blue-400' : 'text-slate-400'}`}>
                                                                ${era.nilBalance}
                                                            </div>
                                                        </div>
                                                    </div>

                                                </div>
                                            );
                                        })}
                                    </div>
                                </div>

                            </div>
                        )}

                    </main>

                    {}
                    {/* TRANSFER MODAL */}
                    {isTransferModalOpen && (
                        <div className="fixed inset-0 z-50 bg-slate-950/80 backdrop-blur-md flex items-center justify-center p-4">
                            <div className="glass-card w-full max-w-lg rounded-2xl p-6 border border-slate-700 shadow-2xl relative animate-in fade-in zoom-in duration-200">
                                
                                <div className="flex items-center justify-between pb-4 mb-4 border-b border-slate-800">
                                    <div>
                                        <h3 className="text-xl font-bold text-white flex items-center gap-2">
                                            <i className="fa-solid fa-arrows-rotate text-blue-400"></i> Transfer Athlete #{athlete.id}
                                        </h3>
                                        <p className="text-xs text-slate-400">Simulate Web3 Transfer & Holder Era Reset</p>
                                    </div>
                                    <button 
                                        onClick={() => setIsTransferModalOpen(false)}
                                        className="w-8 h-8 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-400 hover:text-white flex items-center justify-center transition">
                                        <i className="fa-solid fa-xmark"></i>
                                    </button>
                                </div>

                                <form onSubmit={handleTransfer} className="space-y-4">
                                    {/* Notice Banner */}
                                    <div className="bg-amber-500/10 border border-amber-500/30 rounded-xl p-3 text-xs text-amber-200 space-y-1">
                                        <div className="font-bold flex items-center gap-1.5 text-amber-400">
                                            <i className="fa-solid fa-triangle-exclamation"></i> Era Reset Notice
                                        </div>
                                        <p className="leading-relaxed">
                                            1. Current <strong>{activeEra?.eraName} ({activeEra?.ownerName})</strong> will be <strong>CLOSED</strong> (balances settled).<br/>
                                            2. A new <strong>Holder Era {String.fromCharCode(athlete.currentEraLetter.charCodeAt(0) + 1)}</strong> will activate with <strong>$0 / $0</strong> balances.<br/>
                                            3. Athlete <strong>Backpack</strong> items will stay intact!
                                        </p>
                                    </div>

                                    {/* New Owner Name */}
                                    <div>
                                        <label className="block text-xs font-semibold text-slate-300 uppercase mb-1">
                                            New Owner Name
                                        </label>
                                        <input 
                                            type="text" 
                                            value={newOwnerName} 
                                            onChange={(e) => setNewOwnerName(e.target.value)}
                                            placeholder="e.g. Aman"
                                            required
                                            className="w-full bg-slate-900 border border-slate-700 rounded-xl px-3.5 py-2.5 text-sm text-white focus:outline-none focus:border-blue-500 transition"
                                        />
                                    </div>

                                    {/* New Owner Wallet */}
                                    <div>
                                        <label className="block text-xs font-semibold text-slate-300 uppercase mb-1">
                                            New Owner Wallet Address
                                        </label>
                                        <input 
                                            type="text" 
                                            value={newOwnerWallet} 
                                            onChange={(e) => setNewOwnerWallet(e.target.value)}
                                            placeholder="0xABC123..."
                                            required
                                            className="w-full bg-slate-900 border border-slate-700 rounded-xl px-3.5 py-2.5 text-sm text-white font-mono focus:outline-none focus:border-blue-500 transition"
                                        />
                                    </div>

                                    {/* Mode Selection */}
                                    <div>
                                        <label className="block text-xs font-semibold text-slate-300 uppercase mb-1">
                                            Select Mode for New Era
                                        </label>
                                        <div className="grid grid-cols-2 gap-3">
                                            <button
                                                type="button"
                                                onClick={() => setSelectedMode('Collector')}
                                                className={`p-3 rounded-xl border text-left transition flex flex-col justify-between ${selectedMode === 'Collector' ? 'bg-blue-600/20 border-blue-500 text-white' : 'bg-slate-900 border-slate-800 text-slate-400 hover:border-slate-700'}`}>
                                                <div className="font-bold text-sm mb-0.5"><i className="fa-solid fa-box-archive mr-1.5"></i> Collector</div>
                                                <div className="text-[10px] text-slate-400">Hold NFT for fan perks & trophies</div>
                                            </button>
                                            <button
                                                type="button"
                                                onClick={() => setSelectedMode('NIL')}
                                                className={`p-3 rounded-xl border text-left transition flex flex-col justify-between ${selectedMode === 'NIL' ? 'bg-indigo-600/20 border-indigo-500 text-white' : 'bg-slate-900 border-slate-800 text-slate-400 hover:border-slate-700'}`}>
                                                <div className="font-bold text-sm mb-0.5"><i className="fa-solid fa-handshake mr-1.5"></i> NIL Sponsor</div>
                                                <div className="text-[10px] text-slate-400">Direct athlete sponsorship & deals</div>
                                            </button>
                                        </div>
                                    </div>

                                    {/* Action Buttons */}
                                    <div className="flex items-center justify-end space-x-3 pt-4 border-t border-slate-800">
                                        <button 
                                            type="button" 
                                            onClick={() => setIsTransferModalOpen(false)}
                                            className="px-4 py-2.5 rounded-xl text-xs font-semibold text-slate-400 hover:text-white hover:bg-slate-800 transition">
                                            Cancel
                                        </button>
                                        <button 
                                            type="submit"
                                            className="bg-blue-600 hover:bg-blue-500 text-white font-bold px-5 py-2.5 rounded-xl text-xs shadow-lg shadow-blue-600/30 transition flex items-center gap-2">
                                            <i className="fa-solid fa-check"></i> Confirm Transfer
                                        </button>
                                    </div>
                                </form>

                            </div>
                        </div>
                    )}

                    {}
                    <footer className="border-t border-slate-800 py-4 bg-slate-950 text-center text-xs text-slate-500">
                        <div className="max-w-6xl mx-auto px-4 flex flex-col sm:flex-row items-center justify-between gap-2">
                            <span>Athlete Web3 Architecture MVP — Demonstrating Backpack & Holder Era Persistence</span>
                            <span className="text-slate-600">Pure Local Frontend State • Demo Version</span>
                        </div>
                    </footer>
                </div>
            );
        }

        const rootElement = document.getElementById('root');
        const root = ReactDOM.createRoot(rootElement);
        root.render(<App />);
    </script>
</body>
</html>
